[project]
name = "cfg-bench-data"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["flpq-data==6.0.0.dev15"]

[dependency-groups]
lint = ["clang-format==23.1.2", "ruff==0.16.10"]

[tool.uv]
package = false

# flpq-data 6.0.0 is published to TestPyPI only (pre-release), every other package comes from PyPI
[tool.uv.sources]
flpq-data = { index = "testpypi" }

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
explicit = true

[tool.ruff]
line-length = 120
