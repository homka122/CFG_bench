name: Build

on:
    push:
        branches: ["*"]
    pull_request:
        branches: [main]

env:
    GRAPHBLAS_REPOSITORY: https://github.com/DrTimothyAldenDavis/GraphBLAS.git
    GRAPHBLAS_REF: afbe9aaefe5df7632ca82b478d65d0f6c1e14db0
    LAGRAPH_REPOSITORY: https://github.com/SparseLinearAlgebra/LAGraph.git
    LAGRAPH_REF: homka122/all_algorithms_benchmark

jobs:
    lint:
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v10.2.0
              with:
                  enable-cache: true

            - name: Run linters
              run: make lint

    deps:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        outputs:
            lagraph: ${{ steps.dependency-revisions.outputs.lagraph }}
        steps:
            - name: Check build tools
              run: |
                  gcc --version
                  make --version
                  git --version
                  ninja --version

            - name: Resolve dependency revisions
              id: dependency-revisions
              run: |
                  git ls-remote "$LAGRAPH_REPOSITORY" "refs/heads/$LAGRAPH_REF" | awk '{print "lagraph=" $1}' >> "$GITHUB_OUTPUT"

            - name: Cache GraphBLAS build
              id: cache-graphblas
              uses: actions/cache@v4
              with:
                  path: GraphBLAS
                  key: ${{ runner.os }}-${{ runner.arch }}-graphblas-compact-${{ env.GRAPHBLAS_REF }}

            - name: Build GraphBLAS
              if: steps.cache-graphblas.outputs.cache-hit != 'true'
              run: |
                  git clone "$GRAPHBLAS_REPOSITORY" GraphBLAS
                  git -C GraphBLAS checkout "$GRAPHBLAS_REF"
                  CMAKE_OPTIONS="-G Ninja" make -C GraphBLAS compact

            - name: Cache LAGraph build
              id: cache-lagraph
              uses: actions/cache@v4
              with:
                  path: LAGraph
                  key: ${{ runner.os }}-${{ runner.arch }}-lagraph-${{ env.GRAPHBLAS_REF }}-${{ steps.dependency-revisions.outputs.lagraph }}

            - name: Build LAGraph benchmark branch
              if: steps.cache-lagraph.outputs.cache-hit != 'true'
              run: |
                  sudo make -C GraphBLAS install
                  git clone "$LAGRAPH_REPOSITORY" LAGraph
                  git -C LAGraph checkout "${{ steps.dependency-revisions.outputs.lagraph }}"
                  CMAKE_OPTIONS="-G Ninja" make -C LAGraph

    build:
        needs: deps
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install dependencies
              uses: ./.github/actions/install-deps
              with:
                  graphblas-ref: ${{ env.GRAPHBLAS_REF }}
                  lagraph-rev: ${{ needs.deps.outputs.lagraph }}

            - name: Build benchmark
              run: make

            - name: Upload benchmark binary
              uses: actions/upload-artifact@v4
              with:
                  name: cfg_bench
                  path: build/cfg_bench
                  retention-days: 1

    test:
        needs: [deps, build]
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        env:
            GRAPHBLAS_CACHE_PATH: ${{ github.workspace }}/.cache/graphblas-jit
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install dependencies
              uses: ./.github/actions/install-deps
              with:
                  graphblas-ref: ${{ env.GRAPHBLAS_REF }}
                  lagraph-rev: ${{ needs.deps.outputs.lagraph }}

            # downloaded after checkout, so the binary is newer than the sources and make CI doesn't rebuild it
            - name: Download benchmark binary
              uses: actions/download-artifact@v4
              with:
                  name: cfg_bench
                  path: build

            - name: Cache GraphBLAS JIT kernels
              uses: actions/cache@v4
              with:
                  path: ${{ env.GRAPHBLAS_CACHE_PATH }}
                  key: ${{ runner.os }}-${{ runner.arch }}-graphblas-jit-${{ env.GRAPHBLAS_REF }}-${{ needs.deps.outputs.lagraph }}-${{ hashFiles('Makefile', 'src/**/*.c', 'src/**/*.h', 'configs/for_test.csv', 'data/grammars/**', 'data/graphs/**') }}
                  restore-keys: |
                      ${{ runner.os }}-${{ runner.arch }}-graphblas-jit-${{ env.GRAPHBLAS_REF }}-

            - name: Run benchmark tests
              run: |
                  chmod +x build/cfg_bench
                  export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
                  make CI
